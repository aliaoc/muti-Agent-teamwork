name: 功能建议
description: 提出新能力、新运行时适配或流程改进（涉及产物契约/评分规则时请先讨论）
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        行为类改动（阶段顺序、产物字段、评分规则、默认值）会影响所有人，建议先在这里对齐再写代码。
        先读 `CONTRIBUTING.md` 的「兼容性与回归纪律」。

  - type: input
    id: goal
    attributes:
      label: 一句话目标
      placeholder: "让 第 3 轮审核结果可以冻结归档"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 场景与动机
      description: 现在卡在哪？不做会怎样？最好给一个真实任务例子
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它怎么工作？能否只用现有接口/字段实现？
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 预计改动面
      description: 哪些阶段/文件/产物字段会变？是否需要升 SCHEMA_VERSION？
      placeholder: "可能需改 teamwork_lib.py 的 validate_*、templates、references/artifacts.md、selftest 断言"

  - type: dropdown
    id: breaking
    attributes:
      label: 是否破坏兼容
      options:
        - "否：纯新增，旧 run 不受影响"
        - "是：需升 SCHEMA_VERSION / 旧 run 需迁移"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有更小的做法？

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue/PR，没有重复
          required: true
