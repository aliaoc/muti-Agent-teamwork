name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Windows runner 默认控制台编码可能是 cp1252，脚本输出中文会 UnicodeEncodeError。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: python -m pip install --upgrade pip pyyaml

      - name: 安装可选绘图依赖（只在一个组合里覆盖 PNG 渲染路径）
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pip install matplotlib

      - name: 校验 .claude/skills 与 skills/ 同步
        run: python tools/sync_claude.py --check

      - name: py_compile
        # 不要用 shell 通配符：Windows runner 默认 PowerShell，不会展开 *.py
        run: python -m compileall -q skills/teamwork/scripts tools

      - name: 运行 23 阶段自检
        env:
          TEAMWORK_RUNS_ROOT: ${{ runner.temp }}/teamwork-runs
        run: python skills/teamwork/scripts/selftest.py
